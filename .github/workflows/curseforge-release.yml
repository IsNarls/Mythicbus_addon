name: Release Mythicbus to CurseForge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_TYPE="release"
          if [[ "${VERSION}" == *"-beta"* ]]; then
            RELEASE_TYPE="beta"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build addon ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_ROOT="package/Mythicbus"

          mkdir -p "$PACKAGE_ROOT"

          rsync -av \
            --exclude=".git/" \
            --exclude="__pycache__/" \
            Mythicbus/ "$PACKAGE_ROOT/"

          cd package
          zip -r "../Mythicbus-${VERSION}.zip" Mythicbus

      - name: Create upload metadata
        shell: bash
        env:
          CURSEFORGE_GAME_VERSION_NAMES: ${{ vars.CURSEFORGE_GAME_VERSION_NAMES }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TYPE="${{ steps.version.outputs.release_type }}"
          GAME_VERSION_NAMES="${CURSEFORGE_GAME_VERSION_NAMES:-12.1.0}"

          jq -n \
            --arg changelog "Automated release ${VERSION}" \
            --arg displayName "Mythicbus ${VERSION}" \
            --arg releaseType "${RELEASE_TYPE}" \
            --arg gameVersionNames "${GAME_VERSION_NAMES}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              releaseType: $releaseType,
              gameVersionNames: ($gameVersionNames | split(",") | map(gsub("^\\s+|\\s+$"; "")))
            }' > metadata.json

          jq . metadata.json

      - name: Validate secrets
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          failed=0

          for name in CURSEFORGE_TOKEN CURSEFORGE_PROJECT_ID DISCORD_TOKEN DISCORD_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set in this GitHub repository's Actions secrets."
              failed=1
            else
              echo "${name} is set."
            fi
          done

          if [ -n "${CURSEFORGE_PROJECT_ID}" ] && ! [[ "${CURSEFORGE_PROJECT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::CURSEFORGE_PROJECT_ID must be the numeric CurseForge project ID."
            failed=1
          fi

          exit "${failed}"

      - name: Upload to CurseForge
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          export VERSION

          if [ -z "${CURSEFORGE_TOKEN}" ] || [ -z "${CURSEFORGE_PROJECT_ID}" ]; then
            echo "CurseForge upload failed: CURSEFORGE_TOKEN or CURSEFORGE_PROJECT_ID secret is not set."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import sys
          import uuid
          import urllib.request
          import urllib.error

          version = os.environ["VERSION"]
          project_id = os.environ["CURSEFORGE_PROJECT_ID"]
          token = os.environ["CURSEFORGE_TOKEN"]
          zip_name = f"Mythicbus-{version}.zip"
          url = f"https://wow.curseforge.com/api/projects/{project_id}/upload-file"

          with open("metadata.json", "r", encoding="utf-8") as handle:
              metadata = json.load(handle)
          metadata_json = json.dumps(metadata, separators=(",", ":"))
          print(f"Prepared CurseForge metadata ({len(metadata_json)} bytes).")

          with open(zip_name, "rb") as handle:
              zip_bytes = handle.read()

          boundary = f"----mythicbus-{uuid.uuid4().hex}"
          chunks = [
              f"--{boundary}\r\n".encode("ascii"),
              b'Content-Disposition: form-data; name="metadata"\r\n',
              b"Content-Type: application/json\r\n\r\n",
              metadata_json.encode("utf-8"),
              b"\r\n",
              f"--{boundary}\r\n".encode("ascii"),
              f'Content-Disposition: form-data; name="file"; filename="{zip_name}"\r\n'.encode("utf-8"),
              b"Content-Type: application/zip\r\n\r\n",
              zip_bytes,
              b"\r\n",
              f"--{boundary}--\r\n".encode("ascii"),
          ]
          body_bytes = b"".join(chunks)

          request = urllib.request.Request(
              url,
              data=body_bytes,
              method="POST",
              headers={
                  "X-Api-Token": token,
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
                  "Content-Length": str(len(body_bytes)),
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  status = response.status
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              status = exc.code

          print(body)
          if status < 200 or status >= 300:
              print(f"CurseForge upload failed with HTTP {status}.")
              sys.exit(1)
          PY

      - name: Notify Discord success
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ -z "${DISCORD_TOKEN}" ] || [ -z "${DISCORD_CHANNEL_ID}" ]; then
            echo "Discord notification skipped: DISCORD_TOKEN or DISCORD_CHANNEL_ID secret is not set."
            exit 0
          fi

          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bot ${DISCORD_TOKEN}" \
            --form "content=Mythicbus ${VERSION} uploaded successfully to CurseForge." \
            --form "files[0]=@Mythicbus-${VERSION}.zip;type=application/zip" \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages"

      - name: Notify Discord failure
        if: failure()
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ -z "${DISCORD_TOKEN}" ] || [ -z "${DISCORD_CHANNEL_ID}" ]; then
            echo "Discord notification skipped: DISCORD_TOKEN or DISCORD_CHANNEL_ID secret is not set."
            exit 0
          fi

          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bot ${DISCORD_TOKEN}" \
            --form "content=Mythicbus ${VERSION} release workflow failed before the CurseForge upload/notification completed." \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages"
